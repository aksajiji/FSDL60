<!--3.	Survey Form: Build a survey form with fields for name, email, age, dropdown for preferences, radio buttons for ratings, and a submit button. Style it with CSS.-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Survey Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      padding: 40px;
    }

    .survey-container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #333;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .radio-group {
      margin-top: 10px;
    }

    .radio-group input {
      margin-right: 8px;
    }

    button {
      display: block;
      width: 100%;
      margin-top: 20px;
      background: #0d6efd;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0b5ed7;
    }
  </style>
</head>
<body>

  <div class="survey-container">
    <h2>Feedback Survey</h2>
    <form>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />

      <label for="age">Age:</label>
      <input type="number" id="age" name="age" min="10" max="100" required />

      <label for="preference">Preferred Product Type:</label>
      <select id="preference" name="preference" required>
        <option value="">--Select--</option>
        <option value="headphones">Headphones</option>
        <option value="speakers">Speakers</option>
        <option value="books">Books</option>
        <option value="accessories">Accessories</option>
      </select>

      <label>Rate Your Experience:</label>
      <div class="radio-group">
        <input type="radio" name="rating" value="Excellent" required /> Excellent<br />
        <input type="radio" name="rating" value="Good" /> Good<br />
        <input type="radio" name="rating" value="Average" /> Average<br />
        <input type="radio" name="rating" value="Poor" /> Poor
      </div>

      <button type="submit">Submit Survey</button>
    </form>
  </div>

</body>
</html>
