<!-- Product Landing Page: Design a landing page for a product (e.g., headphones, book) with a header, product image, description, pricing, and a call-to-action button. Use Bootstrap grids. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product Landing Page - Headphones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f2f4f6;
    }
    .hero {
      background-color: #ffffff;
      padding: 60px 0;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .product-image {
      max-width: 100%;
      border-radius: 10px;
    }
    .price {
      font-size: 1.5rem;
      color: #198754;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">SoundMax</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <div class="container my-5">
    <div class="row hero align-items-center">
      <div class="col-md-6 mb-4 mb-md-0">
        <img src="https://via.placeholder.com/500x400.png?text=Wireless+Headphones" alt="Wireless Headphones" class="product-image">
      </div>
      <div class="col-md-6">
        <h2>Wireless Noise-Canceling Headphones</h2>
        <p class="lead">Experience the next level of audio clarity with our cutting-edge noise-canceling wireless headphones. Designed for comfort, built for performance.</p>
        <p class="price">$149.99</p>
        <button class="btn btn-success btn-lg mt-3">Buy Now</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3">
    &copy; 2025 SoundMax. All rights reserved.
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
